            </button>
        </div>

                    <div class="md:col-span-2">

                        <input type="text" id="pType" required class="w-full bg-[#090d16] border border-blue-900/50 rounded-xl px-3 py-2.5 text-white" placeholder="Örn: 60 Ah AGM">

                        <input type="text" id="pAh" class="w-full bg-[#090d16] border border-blue-900/50 rounded-xl px-3 py-2.5 text-white" placeholder="60">
                    </div>
                    <div>

                        <input type="text" id="pCca" class="w-full bg-[#090d16] border border-blue-900/50 rounded-xl px-3 py-2.5 text-white" placeholder="680">
                    </div>
                    <div>

                        <div class="grid grid-cols-3 gap-2">

                        <input type="text" id="pPervaz" class="w-full bg-[#090d16] border border-blue-900/50 rounded-xl px-3 py-2.5 text-white" placeholder="B13">

            { category: "Besleme Aküleri", code: "009255AX30", type: "S5AX 11 Ah Besleme Aküsü", ah: "11", cca: "180", length: "150", width: "87", height: "130", pervaz: "B0", haric: "2.995,00 TL", dahil: "3.594,00 TL" },
            { category: "Besleme Aküleri", code: "009255AX40", type: "S5AX 13 Ah Besleme Aküsü", ah: "13", cca: "200", length: "150", width: "87", height: "145", pervaz: "B0", haric: "3.610,00 TL", dahil: "4.332,00 TL" },
            { category: "Besleme Aküleri", code: "009255AX50", type: "S5AX 14 Ah Besleme Aküsü", ah: "14", cca: "200", length: "150", width: "90", height: "145", pervaz: "B0", haric: "3.790,00 TL", dahil: "4.548,00 TL" }
        ];

        window.batteryData = JSON.parse(localStorage.getItem('bosch_local_data') || JSON.stringify(defaultBoschData));
        window.starredItems = {};

        document.addEventListener("DOMContentLoaded", async function() {
            setupTabs();
            filterData();

            try {
                if (window.supabase) {
                    const { createClient } = window.supabase;
                    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    window._supabase = _supabase;

                    let { data, error } = await _supabase.from('bosch_aku').select('*');
                    if (!error && data && data.length > 0) {
                        window.batteryData = data;
                        localStorage.setItem('bosch_local_data', JSON.stringify(data));
                    } else if (!error && (!data || data.length === 0)) {
                        await _supabase.from('bosch_aku').upsert(defaultBoschData);
                    }

                    // Çok satanlar / yıldızlar tablosu
                    let { data: starData } = await _supabase.from('bosch_coksatanlar').select('*');
                    if (starData) {
                        starData.forEach(s => { window.starredItems[s.code] = s.is_starred; });
                    }
                }
            } catch (err) {
                console.log("Supabase/Hibrit bağlantı aktif.");
            } finally {
                setupTabs();
                filterData();
            }
        });

        let currentTab = 'Tümü';

        function setupTabs() {
            const categories = ['Tümü', 'Çok Satanlar', ...new Set((window.batteryData || []).map(i => i.category))];
            const container = document.getElementById('tabContainer');
            if(!container) return;
            container.innerHTML = categories.map(cat => `
                <button onclick="switchTab('${cat}')" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition border ${cat === currentTab ? 'bg-blue-600 text-white border-blue-500 shadow-lg' : 'bg-[#111827] text-blue-300/80 border-blue-950 hover:bg-blue-950 hover:text-white'}">
                    ${cat}
                </button>
            `).join('');
        }

        function switchTab(cat) {
            currentTab = cat;
            setupTabs();
            filterData();
        }

        function filterData() {
            const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
            const tableBody = document.getElementById('tableBody');
            if(!tableBody) return;

            const filtered = (window.batteryData || []).filter(item => {
                const matchSearch = (item.code || '').toLowerCase().includes(query) || (item.type || '').toLowerCase().includes(query) || (item.ah || '').toLowerCase().includes(query);
                if (!matchSearch) return false;
                if (currentTab === 'Tümü') return true;
                if (currentTab === 'Çok Satanlar') return window.starredItems[item.code];
                return item.category === currentTab;
            });

            document.getElementById('productCountBadge').textContent = filtered.length;

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="9" class="text-center py-8 text-blue-300/50">Ürün bulunamadı.</td></tr>`;
                return;
            }

            tableBody.innerHTML = filtered.map(item => `
                <tr class="hover:bg-blue-950/30 transition">
                    <td class="p-3 text-center cursor-pointer text-base ${window.starredItems[item.code] ? 'text-amber-400' : 'text-blue-900'}" onclick="window.toggleStarCloud('${item.code}')">★</td>
                    <td class="p-3 font-mono font-bold text-sky-400">${item.code || ''}</td>
                    <td class="p-3 font-semibold text-slate-100">${item.type || ''}</td>
                    <td class="p-3 text-center text-blue-200/80">${item.ah || '-'} Ah</td>
                    <td class="p-3 text-center text-blue-300/70">${item.cca || '-'}</td>
                    <td class="p-3 text-center text-blue-300/70 text-[11px]">${item.length || ''}x${item.width || ''}x${item.height || ''}</td>
                    <td class="p-3 text-center text-blue-300/70 text-[11px]">${item.pervaz || ''}</td>
                    <td class="p-3 text-right text-amber-300 font-semibold">${item.haric || '-'}</td>
                    <td class="p-3 text-right text-emerald-400 font-bold">${item.dahil || '-'}</td>
                </tr>
            `).join('');
        }

        async function toggleStarCloud(code) {
            const currentStatus = window.starredItems[code] || false;
            window.starredItems[code] = !currentStatus;
            
            if (window._supabase) {
                await window._supabase.from('bosch_coksatanlar').upsert([{ code: code, is_starred: window.starredItems[code] }]);
            }
            filterData();
        }

        function checkExistingProduct(codeVal) {
            const cleanCode = codeVal.trim();
            const found = (window.batteryData || []).find(i => i.code === cleanCode);
            const deleteBtn = document.getElementById('deleteBtn');
            if(found) {
                document.getElementById('pCategory').value = found.category;
                document.getElementById('editOriginalCode').value = found.code;
                document.getElementById('pType').value = found.type;
                document.getElementById('pAh').value = found.ah || '';
                document.getElementById('pCca').value = found.cca || '';
                document.getElementById('pLen').value = found.length || '';
                document.getElementById('pWid').value = found.width || '';
                document.getElementById('pHei').value = found.height || '';
                document.getElementById('pPervaz').value = found.pervaz || '';
                document.getElementById('pHaric').value = found.haric || '';
                document.getElementById('pDahil').value = found.dahil || '';
                deleteBtn.classList.remove('hidden');
            } else {
                deleteBtn.classList.add('hidden');
            }
        }

        function openManageModal() {
            document.getElementById('modalTitle').innerHTML = '<i class="fa-solid fa-box-archive text-blue-400"></i> Ürün Ekle / Güncelle / Sil';
            document.getElementById('productForm').reset();
            document.getElementById('editOriginalCode').value = '';
            document.getElementById('deleteBtn').classList.add('hidden');
            document.getElementById('manageModal').classList.remove('hidden');
        }

        function closeManageModal() {
            document.getElementById('manageModal').classList.add('hidden');
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const oldCode = document.getElementById('editOriginalCode').value;
            const newCode = document.getElementById('pCode').value.trim();

            if (oldCode && oldCode !== newCode) {
                await deleteProductFromCloudSilent(oldCode);
            }

            const prod = {
                category: document.getElementById('pCategory').value,
                code: newCode,
                type: document.getElementById('pType').value.trim(),
                ah: document.getElementById('pAh').value.trim(),
                cca: document.getElementById('pCca').value.trim(),
                length: document.getElementById('pLen').value.trim(),
                width: document.getElementById('pWid').value.trim(),
                height: document.getElementById('pHei').value.trim(),
                pervaz: document.getElementById('pPervaz').value.trim(),
                haric: document.getElementById('pHaric').value.trim(),
                dahil: document.getElementById('pDahil').value.trim()
            };

            const idx = window.batteryData.findIndex(i => i.code === prod.code);
            if (idx !== -1) {
                window.batteryData[idx] = prod;
            } else {
                window.batteryData.push(prod);
            }

            localStorage.setItem('bosch_local_data', JSON.stringify(window.batteryData));

            if (window._supabase) {
                await window._supabase.from('bosch_aku').upsert([prod]);
            }

            closeManageModal();
            setupTabs();
            filterData();
        }

        async function deleteProductFromCloudSilent(code) {
            window.batteryData = window.batteryData.filter(i => i.code !== code);
            localStorage.setItem('bosch_local_data', JSON.stringify(window.batteryData));
            if (window._supabase) {
                await window._supabase.from('bosch_aku').delete().eq('code', code);
            }
        }

        async function deleteCurrentProduct() {
            const code = document.getElementById('pCode').value.trim();
            if(code && confirm('Bu Bosch aküyü silmek istediğinize emin misiniz?')) {
                await deleteProductFromCloudSilent(code);
                closeManageModal();
                setupTabs();
                filterData();
            }
        }
    </script>
