    <script src="https://cdn.tailwindcss.com"></script>

            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-red-600 via-red-800 to-zinc-950 border-2 border-red-500/50 flex flex-col items-center justify-center shadow-lg shadow-red-900/30 p-1 shrink-0">

                    <span class="text-[8px] font-black tracking-widest text-white mt-0.5">YİĞİT</span>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-wider text-white flex items-center gap-2">
                        YİĞİT <span class="text-red-500">AKÜ</span> <span class="text-[10px] bg-red-950 text-red-400 border border-red-800/60 font-semibold px-2 py-0.5 rounded-full">FİYAT & STOK</span>
                    </h1>
                    <p class="text-[10px] text-zinc-400 font-medium">AYAN OTO ELEKTRİK | İBRAHİM AYAN</p>
                </div>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                <div class="relative flex-1 md:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="filterData()" placeholder="Akü kodu veya tip ara..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none focus:border-red-600">
                </div>
                <div class="text-xs bg-zinc-900 px-3 py-2 rounded-xl border border-zinc-800 text-zinc-300 font-semibold shrink-0">
                    <span id="productCountBadge">0</span> Ürün
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
        <!-- Sekmeler -->
        <div class="flex items-center justify-between gap-2 border-b border-zinc-800 pb-3 overflow-x-auto">
            <div id="tabContainer" class="flex gap-2"></div>
            <button onclick="openManageModal()" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold transition flex items-center gap-2 shrink-0 shadow-lg">
                <i class="fa-solid fa-pen-to-square"></i> Ürün Ekle / Yönet (Düzenle & Sil)
            </button>
        </div>

        <!-- Ürünler Tablosu -->
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-xs">
                    <thead>
                        <tr class="bg-zinc-950 text-zinc-400 uppercase text-[10px] border-b border-zinc-800">
                            <th class="p-3 w-10 text-center">⭐</th>
                            <th class="p-3">Akü Kodu</th>
                            <th class="p-3">Akü Tipi / Tanımı</th>
                            <th class="p-3 text-center">CCA</th>
                            <th class="p-3 text-center">Ölçüler (B-E-Y)</th>
                            <th class="p-3">Pervaz / Açıklama</th>
                            <th class="p-3 text-right">KDV Hariç</th>
                            <th class="p-3 text-right">İskontolu</th>
                            <th class="p-3 text-right text-emerald-400">Net Maliyet</th>
                            <th class="p-3 text-right text-red-400">Satış Fiyatı</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-zinc-800/60"></tbody>
                </table>
            </div>
        </div>
    </main>

                    <div>
                        <label class="block font-bold uppercase text-zinc-400 mb-1">Akü Kodu *</label>
                        <input type="text" id="pCode" required oninput="checkExistingProduct(this.value)" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-white" placeholder="Örn: 25502450">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block font-bold uppercase text-zinc-400 mb-1">Akü Tipi / Tanımı *</label>
                        <input type="text" id="pType" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-white" placeholder="Örn: 12V 50 Ah L1 DÜZ MF">
                    </div>
                    <div>
                        <label class="block font-bold uppercase text-zinc-400 mb-1">CCA (EN)</label>
                        <input type="text" id="pCca" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-white" placeholder="480">
                    </div>
                    <div>
                        <label class="block font-bold uppercase text-zinc-400 mb-1">Ölçüler (Boy x En x Yükseklik mm)</label>
                        <div class="grid grid-cols-3 gap-2">
                            <input type="text" id="pLen" class="bg-zinc-950 border border-zinc-800 rounded-xl px-2 py-2.5 text-white text-center" placeholder="Boy">
                            <input type="text" id="pWid" class="bg-zinc-950 border border-zinc-800 rounded-xl px-2 py-2.5 text-white text-center" placeholder="En">
                            <input type="text" id="pHei" class="bg-zinc-950 border border-zinc-800 rounded-xl px-2 py-2.5 text-white text-center" placeholder="Yükseklik">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold uppercase text-zinc-400 mb-1">Pervaz Tipi</label>
                        <input type="text" id="pPervaz" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-white" placeholder="Tüm Kenar Tırnaklı">
                    </div>
                    <div>
                        <label class="block font-bold uppercase text-zinc-400 mb-1">Açıklama</label>
                        <input type="text" id="pDesc" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-white" placeholder="Ek açıklama...">
                    </div>
                    <div>
                        <label class="block font-bold uppercase text-zinc-400 mb-1">KDV Hariç Fiyat (₺)</label>
                        <input type="text" id="pHaric" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-white" placeholder="5.790,00 TL">
                    </div>
                    <div>

                        <input type="text" id="pIskonto" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-white" placeholder="4.921,50 TL">
                    </div>
                    <div>

                        <input type="text" id="pNet" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-white font-bold" placeholder="5.905,80 TL">
                    </div>

                        <input type="text" id="pSatis" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-white font-bold" placeholder="7.000,00 TL">
                    </div>
                </div>

                </div>
            </form>
        </div>
    </div>

        window.batteryData = JSON.parse(localStorage.getItem('yigit_local_data') || JSON.stringify(defaultData));
        window.starredItems = JSON.parse(localStorage.getItem('yigit_starred_items') || '{}');

        document.addEventListener("DOMContentLoaded", async function() {
            setupTabs();
            filterData();

            try {
                if (window.supabase) {
                    const { createClient } = window.supabase;
                    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    window._supabase = _supabase;

                    // 1. Ürün verilerini çek
                    let { data: prodData, error: prodErr } = await _supabase.from('yigit_aku').select('*');
                    if (!prodErr && prodData && prodData.length > 0) {
                        window.batteryData = prodData;
                        localStorage.setItem('yigit_local_data', JSON.stringify(prodData));
                    }

                    // 2. Yıldız/Çok Satanlar verilerini çek ve birleştir
                    let { data: starData } = await _supabase.from('yigit_coksatanlar').select('*');
                    if (starData && starData.length > 0) {
                        starData.forEach(s => { 
                            window.starredItems[s.code] = s.is_starred; 
                        });
                        localStorage.setItem('yigit_starred_items', JSON.stringify(window.starredItems));
                    }
                }
            } catch (err) {
                console.log("Yerel mod devrede.");
            } finally {
                setupTabs();
                filterData();
            }
        });

        let currentTab = 'Tümü';

        function setupTabs() {
            const categories = ['Tümü', 'Çok Satanlar', ...new Set((window.batteryData || []).map(i => i.category))];
            const container = document.getElementById('tabContainer');
            if(!container) return;
            container.innerHTML = categories.map(cat => `
                <button onclick="switchTab('${cat}')" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition border ${cat === currentTab ? 'bg-red-600 text-white border-red-600 shadow-lg' : 'bg-zinc-900 text-zinc-400 border-zinc-800 hover:bg-zinc-800 hover:text-white'}">
                    ${cat}
                </button>
            `).join('');
        }

        function switchTab(cat) {
            currentTab = cat;
            setupTabs();
            filterData();
        }

        function filterData() {
            const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
            const tableBody = document.getElementById('tableBody');
            if(!tableBody) return;

            const filtered = (window.batteryData || []).filter(item => {
                const matchSearch = (item.code || '').toLowerCase().includes(query) || (item.type || '').toLowerCase().includes(query);
                if (!matchSearch) return false;
                if (currentTab === 'Tümü') return true;
                if (currentTab === 'Çok Satanlar') return !!window.starredItems[item.code];
                return item.category === currentTab;
            });

            document.getElementById('productCountBadge').textContent = filtered.length;

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="10" class="text-center py-8 text-zinc-500">Ürün bulunamadı.</td></tr>`;
                return;
            }

            tableBody.innerHTML = filtered.map(item => `
                <tr class="hover:bg-zinc-800/40 transition">
                    <td class="p-3 text-center cursor-pointer text-base ${window.starredItems[item.code] ? 'text-amber-400' : 'text-zinc-700'}" onclick="toggleStarCloud('${item.code}')">★</td>
                    <td class="p-3 font-mono font-bold text-red-400">${item.code || ''}</td>
                    <td class="p-3 font-semibold text-white">${item.type || ''}</td>
                    <td class="p-3 text-center text-zinc-300">${item.cca || '-'}</td>
                    <td class="p-3 text-center text-zinc-400 text-[11px]">${item.length || ''}x${item.width || ''}x${item.height || ''}</td>
                    <td class="p-3 text-zinc-400 text-[11px]">${item.pervaz || ''} ${item.desc ? '('+item.desc+')' : ''}</td>
                    <td class="p-3 text-right text-amber-300 font-semibold">${item.haric || '-'}</td>
                    <td class="p-3 text-right text-zinc-300">${item.iskonto || '-'}</td>
                    <td class="p-3 text-right text-emerald-400 font-bold">${item.net || '-'}</td>
                    <td class="p-3 text-right text-red-400 font-bold">${item.satis || '-'}</td>
                </tr>
            `).join('');
        }

        // Yıldızlama işlemi
        async function toggleStarCloud(code) {
            const currentStatus = !!window.starredItems[code];
            window.starredItems[code] = !currentStatus;
            
            // Yerel hafızaya kaydet
            localStorage.setItem('yigit_starred_items', JSON.stringify(window.starredItems));

            // Ekrana anında yansıt
            filterData();

            // Supabase bulutuna kaydet
            if (window._supabase) {
                try {
                    await window._supabase.from('yigit_coksatanlar').upsert([{ code: code, is_starred: window.starredItems[code] }]);
                } catch(e) {
                    console.log("Supabase yıldız senkronizasyon hatası:", e);
                }
            }
        }

        function checkExistingProduct(codeVal) {
            const cleanCode = codeVal.trim();
            const found = (window.batteryData || []).find(i => i.code === cleanCode);
            const deleteBtn = document.getElementById('deleteBtn');
            if(found) {
                document.getElementById('pCategory').value = found.category;
                document.getElementById('editOriginalCode').value = found.code;
                document.getElementById('pType').value = found.type;
                document.getElementById('pCca').value = found.cca || '';
                document.getElementById('pLen').value = found.length || '';
                document.getElementById('pWid').value = found.width || '';
                document.getElementById('pHei').value = found.height || '';
                document.getElementById('pPervaz').value = found.pervaz || '';
                document.getElementById('pDesc').value = found.desc || '';
                document.getElementById('pHaric').value = found.haric || '';
                document.getElementById('pIskonto').value = found.iskonto || '';
                document.getElementById('pNet').value = found.net || '';
                document.getElementById('pSatis').value = found.satis || '';
                deleteBtn.classList.remove('hidden');
            } else {
                deleteBtn.classList.add('hidden');
            }
        }

        function openManageModal() {
            document.getElementById('productForm').reset();
            document.getElementById('editOriginalCode').value = '';
            document.getElementById('deleteBtn').classList.add('hidden');
            document.getElementById('manageModal').classList.remove('hidden');
        }

        function closeManageModal() {
            document.getElementById('manageModal').classList.add('hidden');
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const oldCode = document.getElementById('editOriginalCode').value;
            const newCode = document.getElementById('pCode').value.trim();

            if (oldCode && oldCode !== newCode) {
                window.batteryData = window.batteryData.filter(i => i.code !== oldCode);
            }

            const prod = {
                category: document.getElementById('pCategory').value,
                code: newCode,
                type: document.getElementById('pType').value.trim(),
                cca: document.getElementById('pCca').value.trim(),
                length: document.getElementById('pLen').value.trim(),
                width: document.getElementById('pWid').value.trim(),
                height: document.getElementById('pHei').value.trim(),
                pervaz: document.getElementById('pPervaz').value.trim(),
                desc: document.getElementById('pDesc').value.trim(),
                haric: document.getElementById('pHaric').value.trim(),
                iskonto: document.getElementById('pIskonto').value.trim(),
                net: document.getElementById('pNet').value.trim(),
                satis: document.getElementById('pSatis').value.trim()
            };

            const idx = window.batteryData.findIndex(i => i.code === prod.code);
            if (idx !== -1) {
                window.batteryData[idx] = prod;
            } else {
                window.batteryData.push(prod);
            }

            localStorage.setItem('yigit_local_data', JSON.stringify(window.batteryData));

            if (window._supabase) {
                try {
                    await window._supabase.from('yigit_aku').upsert([prod]);
                } catch(e) {}
            }

            closeManageModal();
            setupTabs();
            filterData();
        }

        async function deleteCurrentProduct() {
            const code = document.getElementById('pCode').value.trim();
            if(code && confirm('Bu Yiğit aküyü silmek istediğinize emin misiniz?')) {
                window.batteryData = window.batteryData.filter(i => i.code !== code);
                localStorage.setItem('yigit_local_data', JSON.stringify(window.batteryData));
                if (window._supabase) {
                    try {
                        await window._supabase.from('yigit_aku').delete().eq('code', code);
                    } catch(e) {}
                }
                closeManageModal();
                setupTabs();
                filterData();
            }
        }
    </script>
</body>
